name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify packages
        run: npm run verify

      - name: Audit package tarballs
        run: |
          npm run pack:check --workspace=grid-masonry-core
          npm run pack:check --workspace=grid-masonry-react
          npm run pack:check --workspace=grid-masonry-browser

      - name: Build official site
        run: npm --prefix site run build
